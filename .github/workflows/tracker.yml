name: Rosalía Spotify Tracker

on:
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [check_spotify]
  workflow_dispatch:

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch Spotify Data and Update Stats
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          node -e '
          const fs = require("fs");

          async function getAccessToken() {
            const res = await fetch("https://accounts.spotify.com/api/token", {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "Authorization": "Basic " + Buffer.from(process.env.SPOTIFY_CLIENT_ID + ":" + process.env.SPOTIFY_CLIENT_SECRET).toString("base64")
              },
              body: new URLSearchParams({
                grant_type: "refresh_token",
                refresh_token: process.env.SPOTIFY_REFRESH_TOKEN
              })
            });
            const data = await res.json();
            return data.access_token;
          }

          async function run() {
            try {
              const token = await getAccessToken();
              const spotifyRes = await fetch("https://api.spotify.com/v1/me/player/recently-played?limit=50", {
                headers: { "Authorization": "Bearer " + token }
              });
              const spotifyData = await spotifyRes.json();

              if (!spotifyData.items || spotifyData.items.length === 0) {
                console.log("No recently played tracks found.");
                return;
              }

              // Load history.json (simple YYYY-MM-DD: count map)
              let history = {};
              if (fs.existsSync("./history.json")) {
                try {
                  const raw = JSON.parse(fs.readFileSync("./history.json", "utf8"));
                  for (const [k, v] of Object.entries(raw)) {
                    history[k] = typeof v === "object" ? (v.count || 0) : v;
                  }
                } catch (e) {}
              }

              let lastPlayedData = {};
              if (fs.existsSync("./last_played.json")) {
                try { lastPlayedData = JSON.parse(fs.readFileSync("./last_played.json", "utf8")); } catch (e) {}
              }

              // Filter Rosalía tracks
              const rosaliaItems = spotifyData.items.filter(item => 
                item.track.artists.some(a => a.id === "7ltDVBr6mKbRvohxheJ9h1" || a.name.toLowerCase().includes("rosalía") || a.name.toLowerCase().includes("rosalia"))
              );

              let latestTrack = null;
              if (rosaliaItems.length > 0) {
                const newestItem = rosaliaItems[0];
                latestTrack = {
                  timestamp: newestItem.played_at,
                  track_name: newestItem.track.name,
                  album_name: newestItem.track.album.name,
                  album_art: newestItem.track.album.images[0]?.url || "",
                  spotify_url: newestItem.track.external_urls?.spotify || "",
                  album_url: newestItem.track.album.external_urls?.spotify || ""
                };

                // Track total listens (including repeats) using timestamp deduplication
                let trackedTimestamps = lastPlayedData.tracked_timestamps || [];
                for (const item of rosaliaItems) {
                  if (!trackedTimestamps.includes(item.played_at)) {
                    const dateStr = item.played_at.split("T")[0];
                    history[dateStr] = (history[dateStr] || 0) + 1;
                    trackedTimestamps.push(item.played_at);
                  }
                }
                // Keep recent timestamps buffer
                if (trackedTimestamps.length > 200) trackedTimestamps = trackedTimestamps.slice(-200);
                lastPlayedData.tracked_timestamps = trackedTimestamps;
              }

              if (!latestTrack && lastPlayedData.latest_track) {
                latestTrack = lastPlayedData.latest_track;
              }

              const sortedDates = Object.keys(history).sort();
              const todayStr = new Date().toISOString().split("T")[0];
              const yesterdayObj = new Date();
              yesterdayObj.setDate(yesterdayObj.getDate() - 1);
              const yesterdayStr = yesterdayObj.toISOString().split("T")[0];

              // Calculate active streak
              let currentStreak = 0;
              let checkDate = new Date();
              if (!history[todayStr] && !history[yesterdayStr]) {
                currentStreak = 0;
              } else {
                if (!history[todayStr]) checkDate = yesterdayObj;
                while (true) {
                  const dStr = checkDate.toISOString().split("T")[0];
                  if (history[dStr] && history[dStr] > 0) {
                    currentStreak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                  } else {
                    break;
                  }
                }
              }

              // Calculate Longest Streak Record
              let longestStreak = 0;
              let longestStreakStart = "";
              let longestStreakEnd = "";
              let tempStreak = 0;
              let tempStart = "";

              for (let i = 0; i < sortedDates.length; i++) {
                const curr = sortedDates[i];
                if (history[curr] > 0) {
                  if (tempStreak === 0) {
                    tempStreak = 1;
                    tempStart = curr;
                  } else {
                    const prevDate = new Date(sortedDates[i - 1]);
                    const currDate = new Date(curr);
                    const diffDays = Math.round((currDate - prevDate) / (1000 * 60 * 60 * 24));
                    if (diffDays === 1) {
                      tempStreak++;
                    } else {
                      tempStreak = 1;
                      tempStart = curr;
                    }
                  }

                  if (tempStreak >= longestStreak) {
                    longestStreak = tempStreak;
                    longestStreakStart = tempStart;
                    longestStreakEnd = curr;
                  }
                } else {
                  tempStreak = 0;
                }
              }

              // Calculate Peak Volume Record
              let maxDailyTracks = 0;
              let maxDailyDate = "";
              for (const [dateStr, count] of Object.entries(history)) {
                if (count > maxDailyTracks) {
                  maxDailyTracks = count;
                  maxDailyDate = dateStr;
                }
              }

              fs.writeFileSync("./history.json", JSON.stringify(history, null, 2));

              const outputData = {
                current_streak: currentStreak,
                longest_streak: {
                  count: longestStreak,
                  start_date: longestStreakStart,
                  end_date: longestStreakEnd
                },
                peak_volume: {
                  count: maxDailyTracks,
                  date: maxDailyDate
                },
                latest_track: latestTrack,
                tracked_timestamps: lastPlayedData.tracked_timestamps || []
              };

              fs.writeFileSync("./last_played.json", JSON.stringify(outputData, null, 2));
              console.log("Tracker update completed successfully.");

            } catch (err) {
              console.error("Error updating tracker:", err);
              process.exit(1);
            }
          }

          run();
          '

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_played.json history.json
          git diff-index --quiet HEAD || (git commit -m "Update streak stats & history [skip ci]" && git push)
