<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pietro's ROSALÍA Tracker</title>
  
  <!-- Favicon Link -->
  <link rel="icon" type="image/png" href="./favicon.png">

  <style>
    :root {
      --color-white: #ffffff;
      --color-red: #e60023;
      --spotify-green: #1db954;
      --text-sub: #d0d0d0;
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--color-white);
      position: relative;
      background-color: #0b0b0b;
      overflow-x: hidden;
      padding: 1.5rem;
    }

    /* --- 1. Blurred Background Container (Loads immediately behind loader) --- */
    @keyframes fadeInBg {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .bg-blur {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(20px) brightness(0.5);
      transform: scale(1.2);
      z-index: -1;
      animation: fadeInBg 0.5s ease-out forwards;
    }

    /* --- 2. Three Dots Loader (White & Overlaying Blurred Background) --- */
    .loader-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      z-index: 100;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loader-container.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .dots-loader {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dots-loader div {
      width: 14px;
      height: 14px;
      background-color: var(--color-white);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      animation: dotPulse 1.4s infinite ease-in-out both;
    }

    .dots-loader div:nth-child(1) { animation-delay: -0.32s; }
    .dots-loader div:nth-child(2) { animation-delay: -0.16s; }

    @keyframes dotPulse {
      0%, 80%, 100% {
        transform: scale(0);
        opacity: 0.3;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* --- 3. Main Card Container --- */
    @keyframes fadeInUpCard {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background: rgba(18, 18, 18, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      opacity: 0;
      display: none;
    }

    .card.active {
      display: block;
      animation: fadeInUpCard 0.8s var(--ease-smooth) forwards;
    }

    /* Small Cover Artwork */
    .cover-art {
      width: 140px;
      height: 140px;
      border-radius: 12px;
      margin: 0 auto 1.5rem;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      display: block;
    }

    /* Main Header / Display Text */
    .main-display {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 1.5rem;
      letter-spacing: -0.5px;
      transition: color 0.3s ease;
    }

    .main-display.is-white { color: var(--color-white); }
    .main-display.is-red { color: var(--color-red); }

    /* Button Styling */
    .spotify-btn {
      display: inline-block;
      background-color: var(--color-white);
      color: #000000;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      padding: 0.85rem 1.75rem;
      border-radius: 50px;
      margin-bottom: 2rem;
      transition: transform 0.2s ease, background-color 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
    }

    .spotify-btn:hover {
      transform: scale(1.04);
      background-color: #f0f0f0;
    }

    /* Footer Track Info */
    .track-info {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-sub);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1.5rem;
    }

    .track-info a {
      color: var(--color-white);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }

    .track-info a:hover {
      color: var(--spotify-green);
    }

    /* Staggered Content Animation for Inner Items */
    @keyframes fadeInUpItem {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-item {
      opacity: 0;
      animation: fadeInUpItem 0.8s var(--ease-smooth) forwards;
    }

    /* Sequenced Delays after card appears */
    .delay-1 { animation-delay: 0.25s; }
    .delay-2 { animation-delay: 0.50s; }
    .delay-3 { animation-delay: 0.75s; }
  </style>
</head>
<body>

  <!-- Background Blur Container -->
  <div id="bg-blur" class="bg-blur"></div>

  <!-- Three Dots Loading Overlay -->
  <div id="loader" class="loader-container">
    <div class="dots-loader">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>

  <!-- Main Display Card -->
  <div id="main-card" class="card">
    <!-- Small Cover Artwork -->
    <img id="cover-art" class="cover-art" src="" alt="Album Art" style="display: none;" />

    <!-- Main Counter Display -->
    <h1 id="main-display" class="main-display is-white animate-item delay-1">...</h1>

    <!-- Action Button -->
    <a 
      href="https://open.spotify.com/artist/7ltDVBr6mKbRvohxheJ9h1?si=hGU9GP1URIy31v51-Cj7cQ" 
      target="_blank" 
      rel="noopener noreferrer" 
      class="spotify-btn animate-item delay-2"
    >
      Listen to ROSALÍA now
    </a>

    <!-- Recorded Song Details Footer -->
    <p id="track-info" class="track-info animate-item delay-3">
      Fetching last recorded song...
    </p>
  </div>

  <script>
    async function updateTracker() {
      try {
        const response = await fetch('./last_played.json?cache=' + Date.now());
        const data = await response.json();

        // 1. Set Album Art for small cover & background
        if (data.album_art) {
          const img = document.getElementById('cover-art');
          img.src = data.album_art;
          img.style.display = 'block';

          document.getElementById('bg-blur').style.backgroundImage = `url('${data.album_art}')`;
        }

        // 2. Compute Elapsed Time
        const lastPlayedTime = new Date(data.timestamp).getTime();
        const now = new Date().getTime();
        const diffMs = Math.max(0, now - lastPlayedTime);

        const diffHoursExact = diffMs / (1000 * 60 * 60);
        // Math.ceil rounds up partial hours (e.g. 7.5 hours -> 8 hours)
        const displayHours = Math.ceil(diffHoursExact);
        const displayDays = Math.ceil(diffHoursExact / 24);

        const displayEl = document.getElementById('main-display');

        // 3. Format Main Text & Colors
        if (diffHoursExact < 24) {
          displayEl.className = "main-display is-white animate-item delay-1";

          if (displayHours <= 1) {
            displayEl.innerText = "Pietro has listened to ROSALÍA within the past hour 🙂‍↕️";
          } else {
            displayEl.innerText = `Pietro has listened to ROSALÍA within the past ${displayHours} hours 🙂‍↕️`;
          }
        } else {
          displayEl.className = "main-display is-red animate-item delay-1";

          if (displayDays <= 2) {
            displayEl.innerText = "Pietro hasn't been listening to ROSALÍA for longer than a day 😱";
          } else if (displayDays <= 6) {
            displayEl.innerText = `Pietro hasn't been listening to ROSALÍA for longer than ${displayDays} days 😱`;
          } else {
            const displayWeeks = Math.ceil(displayDays / 7);
            const displayMonths = Math.ceil(displayDays / 30);

            if (displayMonths >= 1) {
              const monthText = displayMonths === 1 ? "a month" : `${displayMonths} months`;
              displayEl.innerText = `Pietro hasn't been listening to ROSALÍA for longer than ${monthText} 😱`;
            } else {
              const weekText = displayWeeks === 1 ? "a week" : `${displayWeeks} weeks`;
              displayEl.innerText = `Pietro hasn't been listening to ROSALÍA for longer than ${weekText} 😱`;
            }
          }
        }

        // 4. Format Date and Time
        const playedDate = new Date(data.timestamp);
        const formattedDate = playedDate.toLocaleDateString(undefined, {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });
        const formattedTime = playedDate.toLocaleTimeString(undefined, {
          hour: '2-digit',
          minute: '2-digit'
        });

        const trackUrl = data.spotify_url || `https://open.spotify.com/artist/7ltDVBr6mKbRvohxheJ9h1`;
        const albumUrl = data.album_url || trackUrl; 

        document.getElementById('track-info').innerHTML = 
          `The last recorded track listened by Pietro was '<a href="${trackUrl}" target="_blank" rel="noopener noreferrer">${data.track_name}</a>' ` +
          `from <a href="${albumUrl}" target="_blank" rel="noopener noreferrer">${data.album_name}</a> ` +
          `on ${formattedDate} at ${formattedTime}.`;

      } catch (err) {
        document.getElementById('main-display').innerText = "Error loading data";
        console.error("Failed to load last_played.json", err);
      }
    }

    // Run initial data fetch
    updateTracker();

    // Trigger 2-second loading animation delay before revealing card
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('main-card').classList.add('active');
      }, 2000);
    });

    // Refresh calculations every minute
    setInterval(updateTracker, 60000);
  </script>
</body>
</html>
