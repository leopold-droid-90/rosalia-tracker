<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pietro's ROSALÍA Tracker</title>
  <link rel="icon" type="image/png" href="./favicon.png">

  <style>
    :root {
      --color-white: #ffffff;
      --color-red: #e60023;
      --color-magenta: #ff007f;
      --spotify-green: #1db954;
      --text-sub: #d0d0d0;
      --card-bg: rgba(18, 18, 18, 0.85);
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      color: var(--color-white); background-color: #0b0b0b;
      overflow-x: hidden; padding: 1.5rem;
    }

    body.modal-open {
      overflow: hidden !important;
    }

    /* Preloaded Slow Blurred Background Animation */
    .bg-blur {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center;
      filter: blur(24px) brightness(0.45); transform: scale(1.15);
      z-index: -1; opacity: 0; transition: opacity 1.8s ease-in-out;
    }
    .bg-blur.loaded { opacity: 1; }

    /* Loader Overlay */
    .loader-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background: transparent; z-index: 100;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .loader-container.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .dots-loader { display: flex; gap: 12px; }
    .dots-loader div {
      width: 14px; height: 14px; background-color: var(--color-white);
      border-radius: 50%; box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      animation: dotPulse 1.4s infinite ease-in-out both;
    }
    .dots-loader div:nth-child(1) { animation-delay: -0.32s; }
    .dots-loader div:nth-child(2) { animation-delay: -0.16s; }
    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Main Container Card */
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px; padding: 2.2rem 1.8rem;
      max-width: 480px; width: 100%; text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: none; opacity: 0;
    }
    .card.active { display: block; animation: fadeInUp 0.7s var(--ease-smooth) forwards; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cover-art {
      width: 125px; height: 125px; border-radius: 14px;
      margin: 0 auto 1.2rem; object-fit: cover;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); display: block;
    }

    .main-headline {
      font-size: 2.1rem; font-weight: 800; line-height: 1.25;
      margin-bottom: 1.5rem; letter-spacing: -0.5px;
    }
    .main-headline.active-streak { color: var(--color-white); }
    .main-headline.inactive-streak { color: var(--color-red); }

    /* 7-Day Quick Strip */
    .strip-container {
      margin: 1.5rem 0; padding: 1rem 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .strip-title { font-size: 0.8rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.8rem; }
    .strip-days { display: flex; justify-content: space-between; align-items: center; }
    .day-node { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .day-circle {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem;
    }
    .day-circle.played { background: var(--color-white); color: #000; box-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }
    .day-circle.missed { border: 2px solid rgba(255, 255, 255, 0.2); color: rgba(255, 255, 255, 0.3); }
    .day-label { font-size: 0.75rem; color: var(--text-sub); font-weight: 600; }

    /* Record Badges */
    .records-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin: 1.2rem 0 1.8rem; }
    .record-card {
      background: rgba(255, 255, 255, 0.05); padding: 0.9rem;
      border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.08); text-align: left;
    }
    .record-label { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 4px; }
    .record-value { font-size: 1.1rem; font-weight: 800; }
    .record-sub { font-size: 0.72rem; color: rgba(255, 255, 255, 0.65); margin-top: 2px; }

    /* Action Buttons */
    .btn-group { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
    .spotify-btn {
      display: block; background: var(--color-white); color: #000;
      font-weight: 700; font-size: 0.95rem; text-decoration: none;
      padding: 0.85rem; border-radius: 50px; transition: transform 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
    }
    .spotify-btn:hover { transform: scale(1.03); background: #f0f0f0; }
    
    .history-btn {
      display: block; background: transparent; color: var(--color-white);
      border: 1px solid rgba(255, 255, 255, 0.3); font-weight: 600; font-size: 0.9rem;
      padding: 0.75rem; border-radius: 50px; cursor: pointer; transition: all 0.2s ease;
    }
    .history-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--color-white); }

    /* Footer Track Info */
    .track-info {
      font-size: 0.9rem; line-height: 1.5; color: var(--text-sub);
      border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 1.2rem;
    }
    .track-info a { color: var(--color-white); font-weight: 600; text-decoration: underline; }

    /* Calendar Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(15px);
      z-index: 200; opacity: 0; visibility: hidden; transition: all 0.3s ease;
      display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 2rem 1rem;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    
    .modal-content {
      background: #141414; border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px; max-width: 480px; width: 100%; padding: 1.8rem;
      color: var(--color-white); position: relative;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
    .modal-title { font-size: 1.3rem; font-weight: 800; }
    .close-btn { background: none; border: none; color: #fff; font-size: 1.6rem; cursor: pointer; }

    /* Navigation Tabs */
    .toggle-container {
      display: flex; align-items: center; background: rgba(255,255,255,0.08);
      border-radius: 30px; padding: 4px; font-size: 0.85rem; margin-bottom: 1rem;
    }
    .toggle-option {
      flex: 1; text-align: center; padding: 8px 12px; border-radius: 20px; cursor: pointer; transition: all 0.2s ease;
    }
    .toggle-option.active { background: var(--color-white); color: #000; font-weight: 700; }

    /* Heatmap Scale Legend */
    .heatmap-legend {
      display: none; align-items: center; justify-content: center; gap: 8px;
      font-size: 0.75rem; color: var(--text-sub); margin-bottom: 1.2rem;
    }
    .heatmap-legend.active { display: flex; }
    .legend-box { width: 14px; height: 14px; border-radius: 3px; }

    /* Calendar Grid Setup */
    .month-section { margin-bottom: 2rem; }
    .month-name { font-size: 1rem; font-weight: 700; margin-bottom: 0.8rem; text-align: left; color: var(--text-sub); }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px 0; text-align: center; }
    .weekday-header { font-size: 0.75rem; color: rgba(255, 255, 255, 0.4); font-weight: 600; margin-bottom: 6px; }
    
    .cal-cell {
      display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative;
      overflow: visible;
    }

    /* Circle Container for Exact Ribbon Wrapping & Sunrays */
    .circle-wrapper {
      position: relative; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      overflow: visible;
    }

    .cal-circle {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700; position: relative;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.12);
      z-index: 2;
    }
    .cal-circle.listened { background: var(--color-white); color: #000; }
    .cal-num { font-size: 0.75rem; color: var(--text-sub); font-weight: 600; }

    /* Record Streak Pill Ribbon */
    .ribbon-wrap {
      position: absolute; top: 0; bottom: 0; z-index: 1;
      background: linear-gradient(90deg, var(--color-magenta), var(--color-red));
    }
    .ribbon-wrap.single { left: 0; right: 0; border-radius: 16px; }
    .ribbon-wrap.start { left: 0; right: -8px; border-top-left-radius: 16px; border-bottom-left-radius: 16px; }
    .ribbon-wrap.middle { left: -8px; right: -8px; }
    .ribbon-wrap.end { left: -8px; right: 0; border-top-right-radius: 16px; border-bottom-right-radius: 16px; }

    /* Rotated Sunray Animation for Peak Volume Day */
    .sunray-svg {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 52px;
      height: 52px;
      pointer-events: none;
      z-index: 3;
      animation: spinRays 10s linear infinite;
      overflow: visible;
    }

    @keyframes spinRays {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="bg-blur" class="bg-blur"></div>

  <!-- Loader Overlay -->
  <div id="loader" class="loader-container">
    <div class="dots-loader"><div></div><div></div><div></div></div>
  </div>

  <!-- Main Card -->
  <div id="main-card" class="card">
    <img id="cover-art" class="cover-art" src="" alt="Album Art" style="display: none;" />

    <h1 id="main-headline" class="main-headline active-streak">...</h1>

    <!-- Past 7 Days Strip -->
    <div class="strip-container">
      <div class="strip-title">Past 7 Days</div>
      <div id="strip-days" class="strip-days"></div>
    </div>

    <!-- Record Badges -->
    <div class="records-grid">
      <div class="record-card">
        <div class="record-label">🔥 Longest Streak</div>
        <div id="record-streak-val" class="record-value">-</div>
        <div id="record-streak-sub" class="record-sub">No record yet</div>
      </div>
      <div class="record-card">
        <div class="record-label">👑 Most tracks in a day</div>
        <div id="record-volume-val" class="record-value">-</div>
        <div id="record-volume-sub" class="record-sub">No record yet</div>
      </div>
    </div>

    <div class="btn-group">
      <a href="https://open.spotify.com/artist/7ltDVBr6mKbRvohxheJ9h1" target="_blank" rel="noopener" class="spotify-btn">
        Listen to ROSALÍA now
      </a>
      <button id="open-history-btn" class="history-btn">View Full History Calendar</button>
    </div>

    <p id="track-info" class="track-info">Fetching last recorded song...</p>
  </div>

  <!-- Full History Modal -->
  <div id="history-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Listening History</h2>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>

      <!-- Navigation Tabs -->
      <div class="toggle-container">
        <div id="toggle-binary" class="toggle-option active">Streak</div>
        <div id="toggle-heatmap" class="toggle-option">Tracks per day</div>
      </div>

      <!-- Dynamic Heatmap Scale Legend -->
      <div id="heatmap-legend" class="heatmap-legend">
        <span>0</span>
        <div class="legend-box" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);"></div>
        <div class="legend-box" style="background: #0e4429;"></div>
        <div class="legend-box" style="background: #006d32;"></div>
        <div class="legend-box" style="background: #26a641;"></div>
        <div class="legend-box" style="background: #39d353;"></div>
        <span id="legend-max-label">15+ tracks</span>
      </div>

      <div id="calendar-container">Loading full history...</div>
    </div>
  </div>

  <script>
    let historyData = null;
    let coreData = null;
    let currentMode = 'binary';

    function formatEUDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }

    async function loadCoreTracker() {
      try {
        const res = await fetch('./last_played.json?cache=' + Date.now());
        coreData = await res.json();

        if (coreData.latest_track && coreData.latest_track.album_art) {
          const img = document.getElementById('cover-art');
          img.src = coreData.latest_track.album_art;
          img.style.display = 'block';

          const bgImg = new Image();
          bgImg.src = coreData.latest_track.album_art;
          bgImg.onload = () => {
            const bgBlur = document.getElementById('bg-blur');
            bgBlur.style.backgroundImage = `url('${coreData.latest_track.album_art}')`;
            bgBlur.classList.add('loaded');
          };
        }

        const headlineEl = document.getElementById('main-headline');
        const streak = coreData.current_streak || 0;
        if (streak > 0) {
          headlineEl.className = "main-headline active-streak";
          headlineEl.innerText = `Pietro is on a ${streak}-day ROSALÍA streak 🔥`;
        } else {
          headlineEl.className = "main-headline inactive-streak";
          headlineEl.innerText = `Pietro's ROSALÍA streak was broken 😱`;
        }

        if (coreData.longest_streak && coreData.longest_streak.count > 0) {
          document.getElementById('record-streak-val').innerText = `${coreData.longest_streak.count} Days`;
          document.getElementById('record-streak-sub').innerText = 
            `from ${formatEUDate(coreData.longest_streak.start_date)} to ${formatEUDate(coreData.longest_streak.end_date)}`;
        }

        if (coreData.peak_volume && coreData.peak_volume.count > 0) {
          document.getElementById('record-volume-val').innerText = `${coreData.peak_volume.count} Tracks`;
          document.getElementById('record-volume-sub').innerText = `on ${formatEUDate(coreData.peak_volume.date)}`;
        }

        if (coreData.latest_track) {
          const t = coreData.latest_track;
          const playedDate = new Date(t.timestamp);
          const dateFormatted = playedDate.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
          const timeFormatted = playedDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          document.getElementById('track-info').innerHTML = 
            `Last track: '<a href="${t.spotify_url}" target="_blank">${t.track_name}</a>' from <a href="${t.album_url}" target="_blank">${t.album_name}</a> on ${dateFormatted} at ${timeFormatted}.`;
        }

      } catch (err) {
        console.error("Error loading core tracker", err);
      }
    }

    async function loadFullHistory() {
      try {
        const res = await fetch('./history.json?cache=' + Date.now());
        historyData = await res.json();
        render7DayStrip();
      } catch (err) {
        console.error("History data loading error", err);
      }
    }

    function render7DayStrip() {
      const container = document.getElementById('strip-days');
      container.innerHTML = '';
      
      const days = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      const today = new Date();

      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(today.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        const dayName = days[d.getDay()];

        const hasListened = historyData && (typeof historyData[dateStr] === 'number' ? historyData[dateStr] > 0 : historyData[dateStr]?.count > 0);

        const node = document.createElement('div');
        node.className = 'day-node';
        node.innerHTML = `
          <div class="day-circle ${hasListened ? 'played' : 'missed'}">
            ${hasListened ? '✓' : ''}
          </div>
          <div class="day-label">${i === 0 ? 'Today' : dayName}</div>
        `;
        container.appendChild(node);
      }
    }

    function renderCalendar() {
      const container = document.getElementById('calendar-container');
      if (!historyData || Object.keys(historyData).length === 0) {
        container.innerText = "No historical listening dates recorded yet.";
        return;
      }

      container.innerHTML = '';
      const dates = Object.keys(historyData).sort().reverse();
      const latestDate = new Date(dates[0]);
      const earliestDate = new Date(dates[dates.length - 1]);

      let maxCount = 1;
      for (const count of Object.values(historyData)) {
        const val = typeof count === 'number' ? count : (count?.count || 0);
        if (val > maxCount) maxCount = val;
      }
      document.getElementById('legend-max-label').innerText = `${maxCount} tracks`;

      let currentMonth = new Date(latestDate.getFullYear(), latestDate.getMonth(), 1);

      while (currentMonth >= new Date(earliestDate.getFullYear(), earliestDate.getMonth(), 1)) {
        const monthSection = document.createElement('div');
        monthSection.className = 'month-section';

        const monthName = currentMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        monthSection.innerHTML = `<div class="month-name">${monthName}</div>`;

        const grid = document.createElement('div');
        grid.className = 'calendar-grid';

        ['M', 'T', 'W', 'T', 'F', 'S', 'S'].forEach(w => {
          grid.innerHTML += `<div class="weekday-header">${w}</div>`;
        });

        let firstDayIndex = currentMonth.getDay() - 1;
        if (firstDayIndex === -1) firstDayIndex = 6;

        for (let i = 0; i < firstDayIndex; i++) {
          grid.innerHTML += `<div></div>`;
        }

        const daysInMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();

        for (let day = 1; day <= daysInMonth; day++) {
          const dayDate = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), day);
          const dateStr = dayDate.toISOString().split('T')[0];
          const rawEntry = historyData[dateStr];
          const count = typeof rawEntry === 'number' ? rawEntry : (rawEntry?.count || 0);

          const cell = document.createElement('div');
          cell.className = 'cal-cell';

          const circleWrapper = document.createElement('div');
          circleWrapper.className = 'circle-wrapper';

          const circle = document.createElement('div');
          circle.className = 'cal-circle';

          const dayNum = document.createElement('div');
          dayNum.className = 'cal-num';
          dayNum.innerText = day;

          if (count > 0) {
            circle.classList.add('listened');
            circle.innerText = '✓';

            // Explicit Sunburst SVG for Peak Volume Day
            if (coreData && coreData.peak_volume && dateStr === coreData.peak_volume.date) {
              const svgContainer = document.createElement('div');
              svgContainer.innerHTML = `
                <svg class="sunray-svg" viewBox="0 0 52 52">
                  <line x1="26" y1="2" x2="26" y2="8" stroke="#ff007f" stroke-width="3" stroke-linecap="round" />
                  <line x1="26" y1="44" x2="26" y2="50" stroke="#ff007f" stroke-width="3" stroke-linecap="round" />
                  <line x1="2" y1="26" x2="8" y2="26" stroke="#ff007f" stroke-width="3" stroke-linecap="round" />
                  <line x1="44" y1="26" x2="50" y2="26" stroke="#ff007f" stroke-width="3" stroke-linecap="round" />
                  <line x1="9" y1="9" x2="13" y2="13" stroke="#ff007f" stroke-width="3" stroke-linecap="round" />
                  <line x1="39" y1="39" x2="43" y2="43" stroke="#ff007f" stroke-width="3" stroke-linecap="round" />
                  <line x1="9" y1="43" x2="13" y2="39" stroke="#ff007f" stroke-width="3" stroke-linecap="round" />
                  <line x1="39" y1="13" x2="43" y2="9" stroke="#ff007f" stroke-width="3" stroke-linecap="round" />
                </svg>
              `;
              circleWrapper.appendChild(svgContainer.firstElementChild);
            }

            // Streak Ribbon Layout
            if (currentMode === 'binary' && coreData && coreData.longest_streak &&
                dateStr >= coreData.longest_streak.start_date && dateStr <= coreData.longest_streak.end_date) {
              
              const prevD = new Date(dayDate); prevD.setDate(prevD.getDate() - 1);
              const nextD = new Date(dayDate); nextD.setDate(nextD.getDate() + 1);

              const prevDateStr = prevD.toISOString().split('T')[0];
              const nextDateStr = nextD.toISOString().split('T')[0];

              const isPrevInStreak = prevDateStr >= coreData.longest_streak.start_date && (historyData[prevDateStr] || 0) > 0 && dayDate.getDay() !== 1;
              const isNextInStreak = nextDateStr <= coreData.longest_streak.end_date && (historyData[nextDateStr] || 0) > 0 && dayDate.getDay() !== 0;

              const ribbon = document.createElement('div');
              if (!isPrevInStreak && isNextInStreak) ribbon.className = 'ribbon-wrap start';
              else if (isPrevInStreak && isNextInStreak) ribbon.className = 'ribbon-wrap middle';
              else if (isPrevInStreak && !isNextInStreak) ribbon.className = 'ribbon-wrap end';
              else ribbon.className = 'ribbon-wrap single';

              circleWrapper.appendChild(ribbon);
              circle.style.color = '#fff';
              circle.style.background = 'transparent';
              circle.style.border = 'none';
            }

            // Heatmap mode
            if (currentMode === 'heatmap') {
              circle.innerText = count;
              circle.style.border = 'none';
              circle.style.color = '#fff';

              const ratio = count / maxCount;
              if (ratio >= 0.75) circle.style.background = '#39d353';
              else if (ratio >= 0.50) circle.style.background = '#26a641';
              else if (ratio >= 0.25) circle.style.background = '#006d32';
              else circle.style.background = '#0e4429';
            }
          }

          circleWrapper.appendChild(circle);
          cell.appendChild(circleWrapper);
          cell.appendChild(dayNum);
          grid.appendChild(cell);
        }

        monthSection.appendChild(grid);
        container.appendChild(monthSection);
        currentMonth.setMonth(currentMonth.getMonth() - 1);
      }
    }

    document.getElementById('open-history-btn').addEventListener('click', () => {
      document.body.classList.add('modal-open');
      document.getElementById('history-modal').classList.add('open');
      renderCalendar();
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => {
      document.body.classList.remove('modal-open');
      document.getElementById('history-modal').classList.remove('open');
    });

    document.getElementById('toggle-binary').addEventListener('click', () => {
      currentMode = 'binary';
      document.getElementById('toggle-binary').classList.add('active');
      document.getElementById('toggle-heatmap').classList.remove('active');
      document.getElementById('heatmap-legend').classList.remove('active');
      renderCalendar();
    });

    document.getElementById('toggle-heatmap').addEventListener('click', () => {
      currentMode = 'heatmap';
      document.getElementById('toggle-heatmap').classList.add('active');
      document.getElementById('toggle-binary').classList.remove('active');
      document.getElementById('heatmap-legend').classList.add('active');
      renderCalendar();
    });

    loadCoreTracker();
    loadFullHistory();

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('main-card').classList.add('active');
      }, 1000);
    });
  </script>
</body>
</html>
