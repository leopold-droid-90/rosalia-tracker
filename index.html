<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pietro's ROSALÍA Tracker</title>
  <link rel="icon" type="image/png" href="./favicon.png">

  <style>
    :root {
      --color-white: #ffffff;
      --color-red: #e60023;
      --spotify-green: #1db954;
      --text-sub: #d0d0d0;
      --card-bg: rgba(18, 18, 18, 0.85);
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--color-white);
      background-color: #0b0b0b;
      overflow-x: hidden;
      padding: 1.5rem;
    }

    /* Blurred Background */
    .bg-blur {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center;
      filter: blur(22px) brightness(0.45);
      transform: scale(1.2); z-index: -1;
      transition: background-image 0.8s ease;
    }

    /* Loader Overlay */
    .loader-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background: transparent; z-index: 100;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .loader-container.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .dots-loader { display: flex; gap: 12px; }
    .dots-loader div {
      width: 14px; height: 14px; background-color: var(--color-white);
      border-radius: 50%; box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      animation: dotPulse 1.4s infinite ease-in-out both;
    }
    .dots-loader div:nth-child(1) { animation-delay: -0.32s; }
    .dots-loader div:nth-child(2) { animation-delay: -0.16s; }
    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Main Container Card */
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px; padding: 2.2rem 1.8rem;
      max-width: 480px; width: 100%; text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: none; opacity: 0;
    }
    .card.active { display: block; animation: fadeInUp 0.8s var(--ease-smooth) forwards; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cover-art {
      width: 130px; height: 130px; border-radius: 14px;
      margin: 0 auto 1.2rem; object-fit: cover;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); display: block;
    }

    /* Primary Streak Headline */
    .main-headline {
      font-size: 2.1rem; font-weight: 800; line-height: 1.25;
      margin-bottom: 1.5rem; letter-spacing: -0.5px;
    }
    .main-headline.active-streak { color: var(--color-white); }
    .main-headline.inactive-streak { color: var(--color-red); }

    /* 7-Day Quick Strip */
    .strip-container {
      margin: 1.5rem 0; padding: 1rem 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .strip-title { font-size: 0.8rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.8rem; }
    .strip-days { display: flex; justify-content: space-between; align-items: center; }
    .day-node {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .day-label { font-size: 0.75rem; color: var(--text-sub); font-weight: 600; }
    .day-circle {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem; transition: transform 0.2s ease;
    }
    .day-circle.played { background: var(--color-white); color: #000; box-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }
    .day-circle.missed { border: 2px stroke rgba(255, 255, 255, 0.25); color: rgba(255, 255, 255, 0.3); border: 2px solid rgba(255,255,255,0.2); }

    /* Record Badges */
    .records-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin: 1.2rem 0 1.8rem;
    }
    .record-card {
      background: rgba(255, 255, 255, 0.05); padding: 0.9rem;
      border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.08); text-align: left;
    }
    .record-label { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 4px; }
    .record-value { font-size: 1.1rem; font-weight: 800; }
    .record-sub { font-size: 0.7rem; color: rgba(255, 255, 255, 0.6); margin-top: 2px; }

    /* Action Buttons */
    .btn-group { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
    .spotify-btn {
      display: block; background: var(--color-white); color: #000;
      font-weight: 700; font-size: 0.95rem; text-decoration: none;
      padding: 0.85rem; border-radius: 50px; transition: transform 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
    }
    .spotify-btn:hover { transform: scale(1.03); background: #f0f0f0; }
    
    .history-btn {
      display: block; background: transparent; color: var(--color-white);
      border: 1px solid rgba(255, 255, 255, 0.3); font-weight: 600; font-size: 0.9rem;
      padding: 0.75rem; border-radius: 50px; cursor: pointer; transition: all 0.2s ease;
    }
    .history-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--color-white); }

    /* Footer Track Info */
    .track-info {
      font-size: 0.9rem; line-height: 1.5; color: var(--text-sub);
      border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 1.2rem;
    }
    .track-info a { color: var(--color-white); font-weight: 600; text-decoration: underline; }

    /* Calendar Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px);
      z-index: 200; opacity: 0; visibility: hidden; transition: all 0.3s ease;
      display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 2rem 1rem;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    
    .modal-content {
      background: #141414; border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px; max-width: 500px; width: 100%; padding: 1.8rem;
      color: var(--color-white); position: relative;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;
    }
    .modal-title { font-size: 1.3rem; font-weight: 800; }
    .close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

    /* Toggle Switch */
    .toggle-container {
      display: flex; align-items: center; background: rgba(255,255,255,0.1);
      border-radius: 30px; padding: 4px; font-size: 0.8rem; margin-bottom: 1.5rem;
    }
    .toggle-option {
      flex: 1; text-align: center; padding: 6px 12px; border-radius: 20px; cursor: pointer; transition: all 0.2s ease;
    }
    .toggle-option.active { background: var(--color-white); color: #000; font-weight: 700; }

    /* Calendar Vertical Grid */
    .month-section { margin-bottom: 2rem; }
    .month-name { font-size: 1rem; font-weight: 700; margin-bottom: 0.75rem; text-align: left; color: var(--text-sub); }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
    .weekday-header { font-size: 0.75rem; color: rgba(255, 255, 255, 0.4); font-weight: 600; margin-bottom: 4px; }
    
    .cal-day {
      aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 600; position: relative; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08); transition: transform 0.2s ease;
    }
    .cal-day.empty { background: transparent; border: none; }
    .cal-day.listened { background: var(--color-white); color: #000; font-weight: 800; }
    
    /* Sunburst Peak Volume Day */
    .cal-day.peak-volume {
      box-shadow: 0 0 15px #e60023, 0 0 25px #e60023; border: 2px solid #ffffff; animation: sunburst 2s infinite alternate;
    }
    @keyframes sunburst {
      from { transform: scale(1); box-shadow: 0 0 10px #e60023; }
      to { transform: scale(1.15); box-shadow: 0 0 22px #e60023, 0 0 30px #ffffff; }
    }

    /* Longest Streak Pill Container */
    .cal-day.in-longest-streak {
      background: linear-gradient(135deg, #e60023, #1db954); color: #fff; font-weight: 800; border: none;
    }
  </style>
</head>
<body>

  <div id="bg-blur" class="bg-blur"></div>

  <!-- Loading Animation Overlay -->
  <div id="loader" class="loader-container">
    <div class="dots-loader"><div></div><div></div><div></div></div>
  </div>

  <!-- Main Display Card -->
  <div id="main-card" class="card">
    <img id="cover-art" class="cover-art" src="" alt="Album Art" style="display: none;" />

    <h1 id="main-headline" class="main-headline active-streak">...</h1>

    <!-- 7-Day Strip -->
    <div class="strip-container">
      <div class="strip-title">Past 7 Days</div>
      <div id="strip-days" class="strip-days"></div>
    </div>

    <!-- Record Stats Badges -->
    <div class="records-grid">
      <div class="record-card">
        <div class="record-label">🔥 Longest Streak</div>
        <div id="record-streak-val" class="record-value">-</div>
        <div id="record-streak-sub" class="record-sub">No record yet</div>
      </div>
      <div class="record-card">
        <div class="record-label">👑 Peak Volume</div>
        <div id="record-volume-val" class="record-value">-</div>
        <div id="record-volume-sub" class="record-sub">No record yet</div>
      </div>
    </div>

    <div class="btn-group">
      <a href="https://open.spotify.com/artist/7ltDVBr6mKbRvohxheJ9h1" target="_blank" rel="noopener" class="spotify-btn">
        Listen to ROSALÍA now
      </a>
      <button id="open-history-btn" class="history-btn">View Full History Calendar</button>
    </div>

    <p id="track-info" class="track-info">Fetching last recorded song...</p>
  </div>

  <!-- Full History Modal -->
  <div id="history-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Listening History</h2>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>

      <!-- Binary vs Heatmap Toggle -->
      <div class="toggle-container">
        <div id="toggle-binary" class="toggle-option active">Binary (Listened)</div>
        <div id="toggle-heatmap" class="toggle-option">Heatmap Volume</div>
      </div>

      <!-- Calendar Container -->
      <div id="calendar-container">Loading full history...</div>
    </div>
  </div>

  <script>
    let historyData = null;
    let coreData = null;
    let currentMode = 'binary'; // 'binary' or 'heatmap'

    // Step 1: Fast initial load using lightweight last_played.json (~1KB)
    async function loadCoreTracker() {
      try {
        const res = await fetch('./last_played.json?cache=' + Date.now());
        coreData = await res.json();

        // Render Cover Art
        if (coreData.latest_track && coreData.latest_track.album_art) {
          const img = document.getElementById('cover-art');
          img.src = coreData.latest_track.album_art;
          img.style.display = 'block';
          document.getElementById('bg-blur').style.backgroundImage = `url('${coreData.latest_track.album_art}')`;
        }

        // Render Main Streak Headline
        const headlineEl = document.getElementById('main-headline');
        const streak = coreData.current_streak || 0;
        if (streak > 0) {
          headlineEl.className = "main-headline active-streak";
          headlineEl.innerText = `Pietro is on a ${streak}-day ROSALÍA streak 🔥`;
        } else {
          headlineEl.className = "main-headline inactive-streak";
          headlineEl.innerText = `Pietro's ROSALÍA streak was broken 😱`;
        }

        // Render Records
        if (coreData.longest_streak && coreData.longest_streak.count > 0) {
          document.getElementById('record-streak-val').innerText = `${coreData.longest_streak.count} Days`;
          document.getElementById('record-streak-sub').innerText = `Ended on ${coreData.longest_streak.end_date}`;
        }
        if (coreData.peak_volume && coreData.peak_volume.count > 0) {
          document.getElementById('record-volume-val').innerText = `${coreData.peak_volume.count} Tracks`;
          document.getElementById('record-volume-sub').innerText = `Recorded ${coreData.peak_volume.date}`;
        }

        // Render Track Info Footer
        if (coreData.latest_track) {
          const t = coreData.latest_track;
          const playedDate = new Date(t.timestamp);
          const dateFormatted = playedDate.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
          const timeFormatted = playedDate.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
          document.getElementById('track-info').innerHTML = 
            `Last track: '<a href="${t.spotify_url}" target="_blank">${t.track_name}</a>' from <a href="${t.album_url}" target="_blank">${t.album_name}</a> on ${dateFormatted} at ${timeFormatted}.`;
        }

      } catch (err) {
        console.error("Failed loading core data", err);
      }
    }

    // Step 2: Load past 7 days and history.json in background
    async function loadFullHistory() {
      try {
        const res = await fetch('./history.json?cache=' + Date.now());
        historyData = await res.json();
        render7DayStrip();
      } catch (err) {
        console.error("History data not ready yet", err);
      }
    }

    function render7DayStrip() {
      const container = document.getElementById('strip-days');
      container.innerHTML = '';
      
      const days = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      const today = new Date();

      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(today.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        const dayName = days[d.getDay()];

        const hasListened = historyData && historyData[dateStr] && historyData[dateStr].count > 0;

        const node = document.createElement('div');
        node.className = 'day-node';
        node.innerHTML = `
          <div class="day-circle ${hasListened ? 'played' : 'missed'}">
            ${hasListened ? '✓' : ''}
          </div>
          <div class="day-label">${i === 0 ? 'Today' : dayName}</div>
        `;
        container.appendChild(node);
      }
    }

    // Step 3: Render Calendar Modal (Stacked Months)
    function renderCalendar() {
      const container = document.getElementById('calendar-container');
      if (!historyData || Object.keys(historyData).length === 0) {
        container.innerText = "No historical listening dates recorded yet.";
        return;
      }

      container.innerHTML = '';
      const dates = Object.keys(historyData).sort().reverse();
      const latestDate = new Date(dates[0]);
      const earliestDate = new Date(dates[dates.length - 1]);

      let currentMonth = new Date(latestDate.getFullYear(), latestDate.getMonth(), 1);

      while (currentMonth >= new Date(earliestDate.getFullYear(), earliestDate.getMonth(), 1)) {
        const monthSection = document.createElement('div');
        monthSection.className = 'month-section';

        const monthName = currentMonth.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
        monthSection.innerHTML = `<div class="month-name">${monthName}</div>`;

        const grid = document.createElement('div');
        grid.className = 'calendar-grid';

        // Weekday Headers
        ['M', 'T', 'W', 'T', 'F', 'S', 'S'].forEach(w => {
          grid.innerHTML += `<div class="weekday-header">${w}</div>`;
        });

        // Compute offset days for Monday start
        let firstDayIndex = currentMonth.getDay() - 1;
        if (firstDayIndex === -1) firstDayIndex = 6;

        for (let i = 0; i < firstDayIndex; i++) {
          grid.innerHTML += `<div class="cal-day empty"></div>`;
        }

        const daysInMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();

        for (let day = 1; day <= daysInMonth; day++) {
          const dayDate = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), day);
          const dateStr = dayDate.toISOString().split('T')[0];
          const entry = historyData[dateStr];

          const dayEl = document.createElement('div');
          dayEl.className = 'cal-day';
          dayEl.innerText = day;

          if (entry && entry.count > 0) {
            dayEl.classList.add('listened');
            dayEl.title = `${dateStr}: ${entry.count} tracks listened`;

            // Peak volume styling
            if (coreData.peak_volume && dateStr === coreData.peak_volume.date) {
              dayEl.classList.add('peak-volume');
            }

            // Longest streak styling
            if (coreData.longest_streak && dateStr >= coreData.longest_streak.start_date && dateStr <= coreData.longest_streak.end_date) {
              dayEl.classList.add('in-longest-streak');
            }

            // Heatmap color variations
            if (currentMode === 'heatmap') {
              const alpha = Math.min(1, 0.2 + (entry.count / 15));
              dayEl.style.background = `rgba(29, 185, 84, ${alpha})`;
              dayEl.style.color = '#fff';
            }
          }

          grid.appendChild(dayEl);
        }

        monthSection.appendChild(grid);
        container.appendChild(monthSection);

        // Move back to previous month
        currentMonth.setMonth(currentMonth.getMonth() - 1);
      }
    }

    // Modal Interaction Handlers
    document.getElementById('open-history-btn').addEventListener('click', () => {
      document.getElementById('history-modal').classList.add('open');
      renderCalendar();
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => {
      document.getElementById('history-modal').classList.remove('open');
    });

    document.getElementById('toggle-binary').addEventListener('click', () => {
      currentMode = 'binary';
      document.getElementById('toggle-binary').classList.add('active');
      document.getElementById('toggle-heatmap').classList.remove('active');
      renderCalendar();
    });

    document.getElementById('toggle-heatmap').addEventListener('click', () => {
      currentMode = 'heatmap';
      document.getElementById('toggle-heatmap').classList.add('active');
      document.getElementById('toggle-binary').classList.remove('active');
      renderCalendar();
    });

    // Execute Progressive Loading
    loadCoreTracker();
    loadFullHistory();

    // Reveal main card after 2-second loader animation
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('main-card').classList.add('active');
      }, 2000);
    });
  </script>
</body>
</html>
