<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pietro's ROSALÍA Tracker</title>
  <link rel="icon" type="image/png" href="./favicon.png">

  <style>
    :root {
      --color-white: #ffffff;
      --color-red: #e60023;
      --color-magenta: #ff007f;
      --spotify-green: #1db954;
      --text-sub: #d0d0d0;
      --card-bg: rgba(18, 18, 18, 0.85);
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      color: var(--color-white); background-color: #0b0b0b;
      overflow-x: hidden; padding: 1.5rem;
    }

    /* Disable background page scroll when modal is open */
    body.modal-open { overflow: hidden !important; }

    .bg-blur {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center;
      filter: blur(24px) brightness(0.45); transform: scale(1.15);
      z-index: -1; opacity: 0; transition: opacity 1.8s ease-in-out;
    }
    .bg-blur.loaded { opacity: 1; }

    .loader-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background: transparent; z-index: 100;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .loader-container.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .dots-loader { display: flex; gap: 12px; }
    .dots-loader div {
      width: 14px; height: 14px; background-color: var(--color-white);
      border-radius: 50%; box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      animation: dotPulse 1.4s infinite ease-in-out both;
    }
    .dots-loader div:nth-child(1) { animation-delay: -0.32s; }
    .dots-loader div:nth-child(2) { animation-delay: -0.16s; }
    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* CARD CONTAINER */
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px; padding: 2.2rem 1.8rem;
      max-width: 480px; width: 100%; text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: none; opacity: 0; z-index: 10;
    }
    .card.active { display: block; animation: fadeInUp 0.7s var(--ease-smooth) forwards; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* MOBILE UNCONTAINED / FLOATING LAYOUT */
    @media (max-width: 600px) {
      body { padding: 1rem; align-items: flex-start; }
      .card {
        background: transparent;
        border: none;
        box-shadow: none;
        padding: 1rem 0;
      }
    }

    .cover-art {
      width: 125px; height: 125px; border-radius: 14px;
      margin: 0 auto 1.2rem; object-fit: cover;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); display: block;
    }

    .main-headline {
      font-size: 2.1rem; font-weight: 800; line-height: 1.25;
      margin-bottom: 1.5rem; letter-spacing: -0.5px;
    }
    .main-headline.active-streak { color: var(--color-white); }
    .main-headline.inactive-streak { color: var(--color-red); }

    /* PAST 7 DAYS STRIP */
    .strip-container {
      margin: 1.5rem 0; padding: 1rem 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .strip-title { font-size: 0.8rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.8rem; }
    .strip-days { display: flex; justify-content: space-between; align-items: center; }
    .day-node { display: flex; flex-direction: column; align-items: center; gap: 6px; }

    .records-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin: 1.2rem 0 1.8rem; }
    .record-card {
      background: rgba(255, 255, 255, 0.05); padding: 0.9rem;
      border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.08); text-align: left;
    }
    .record-label { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 4px; }
    .record-value { font-size: 1.1rem; font-weight: 800; }
    .record-sub { font-size: 0.72rem; color: rgba(255, 255, 255, 0.65); margin-top: 2px; }

    .btn-group { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
    .spotify-btn {
      display: block; background: var(--color-white); color: #000;
      font-weight: 700; font-size: 0.95rem; text-decoration: none;
      padding: 0.85rem; border-radius: 50px; transition: transform 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
    }
    .spotify-btn:hover { transform: scale(1.03); background: #f0f0f0; }
    
    .history-btn {
      display: block; background: transparent; color: var(--color-white);
      border: 1px solid rgba(255, 255, 255, 0.3); font-weight: 600; font-size: 0.9rem;
      padding: 0.75rem; border-radius: 50px; cursor: pointer; transition: all 0.2s ease;
    }
    .history-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--color-white); }

    .track-info {
      font-size: 0.9rem; line-height: 1.5; color: var(--text-sub);
      border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 1.2rem;
    }
    .track-info a { color: var(--color-white); font-weight: 600; text-decoration: underline; }

    /* MODAL OVERLAY & MODAL WINDOW */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(15px);
      z-index: 200; opacity: 0; visibility: hidden; transition: all 0.3s ease;
      display: flex; justify-content: center; align-items: center; padding: 1rem;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    
    .modal-content {
      background: #141414; border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px; max-width: 480px; width: 100%; height: 85vh;
      display: flex; flex-direction: column; color: var(--color-white);
      position: relative; overflow: hidden;
    }

    /* STICKY TOP HEADER IN MODAL */
    .modal-sticky-header {
      position: sticky; top: 0; background: #141414; z-index: 50;
      padding: 1.2rem 1.5rem 0.5rem 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
    .modal-title { font-size: 1.3rem; font-weight: 800; }
    .close-btn { background: none; border: none; color: #fff; font-size: 1.6rem; cursor: pointer; }

    .toggle-container {
      display: flex; align-items: center; background: rgba(255,255,255,0.08);
      border-radius: 30px; padding: 4px; font-size: 0.85rem; margin-bottom: 0.8rem;
    }
    .toggle-option {
      flex: 1; text-align: center; padding: 8px 12px; border-radius: 20px; cursor: pointer; transition: all 0.2s ease;
    }
    .toggle-option.active { background: var(--color-white); color: #000; font-weight: 700; }

    /* DYNAMIC MONTH HEADER ABOVE WEEKDAYS */
    .sticky-month-bar {
      font-size: 0.95rem; font-weight: 700; color: var(--color-white);
      padding-bottom: 0.4rem; text-align: center; letter-spacing: 0.2px;
    }

    /* STICKY WEEKDAY HEADERS */
    .calendar-weekdays-sticky {
      display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
      padding: 0.4rem 0; font-size: 0.75rem; color: rgba(255, 255, 255, 0.4);
      font-weight: 600; background: #141414;
    }

    /* CONTINUOUS SCROLLABLE CALENDAR BODY */
    .modal-scroll-body {
      flex: 1; overflow-y: auto; padding: 1rem 1.5rem 5rem 1.5rem;
    }

    .calendar-continuous-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px 0; text-align: center;
    }

    /* STICKY BOTTOM HEATMAP LEGEND */
    .heatmap-legend {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.8rem; display: none; align-items: center; justify-content: center; gap: 8px;
      font-size: 0.75rem; color: var(--text-sub); z-index: 60;
    }
    .heatmap-legend.active { display: flex; }
    .legend-box { width: 14px; height: 14px; border-radius: 3px; }

    /* CIRCLE & RIBBON STYLING FIXES */
    .circle-wrapper {
      position: relative; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
    }

    .cal-circle {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700; position: relative;
      background: transparent; border: none;
      z-index: 3;
    }

    /* GREY DOT FOR UNLISTENED DAYS */
    .cal-circle.empty-dot::after {
      content: ''; width: 5px; height: 5px;
      background-color: rgba(255, 255, 255, 0.25);
      border-radius: 50%; display: block;
    }

    /* WHITE CIRCLE FOR RECORDED STREAK DAYS */
    .cal-circle.listened { background: var(--color-white) !important; color: #000 !important; border: none; }
    .cal-num { font-size: 0.75rem; color: var(--text-sub); font-weight: 600; margin-top: 2px; }

    /* STREAK RIBBON BACKGROUND */
    .ribbon-pill {
      position: absolute; top: -1px; bottom: -1px; z-index: 2;
      background: linear-gradient(90deg, #ff007f, #e60023);
    }
    .ribbon-pill.single { left: -1px; right: -1px; border-radius: 20px; }
    .ribbon-pill.start { left: -1px; right: -12px; border-top-left-radius: 20px; border-bottom-left-radius: 20px; }
    .ribbon-pill.middle { left: -12px; right: -12px; }
    .ribbon-pill.end { left: -12px; right: -1px; border-top-right-radius: 20px; border-bottom-right-radius: 20px; }

    /* PEAK VOLUME 7-RAY ANIMATED SUNBURST */
    .sunray-svg {
      position: absolute; top: -10px; left: -10px; width: 56px; height: 56px;
      pointer-events: none; z-index: 1;
      animation: pulseRays 2.2s ease-in-out infinite;
    }

    @keyframes pulseRays {
      0%, 100% { transform: scale(0.92); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="bg-blur" class="bg-blur"></div>

  <div id="loader" class="loader-container">
    <div class="dots-loader"><div></div><div></div><div></div></div>
  </div>

  <div id="main-card" class="card">
    <img id="cover-art" class="cover-art" src="" alt="Album Art" style="display: none;" />
    <h1 id="main-headline" class="main-headline active-streak">...</h1>

    <div class="strip-container">
      <div class="strip-title">Past 7 Days</div>
      <div id="strip-days" class="strip-days"></div>
    </div>

    <div class="records-grid">
      <div class="record-card">
        <div class="record-label">🔥 Longest Streak</div>
        <div id="record-streak-val" class="record-value">-</div>
        <div id="record-streak-sub" class="record-sub">No record yet</div>
      </div>
      <div class="record-card">
        <div class="record-label">👑 Most tracks in a day</div>
        <div id="record-volume-val" class="record-value">-</div>
        <div id="record-volume-sub" class="record-sub">No record yet</div>
      </div>
    </div>

    <div class="btn-group">
      <a href="https://open.spotify.com/artist/7ltDVBr6mKbRvohxheJ9h1" target="_blank" rel="noopener" class="spotify-btn">
        Listen to ROSALÍA now
      </a>
      <button id="open-history-btn" class="history-btn">View Full History Calendar</button>
    </div>

    <p id="track-info" class="track-info">Fetching last recorded song...</p>
  </div>

  <div id="history-modal" class="modal-overlay">
    <div id="modal-card" class="modal-content">
      
      <!-- STICKY HEADER AREA -->
      <div class="modal-sticky-header">
        <div class="modal-header">
          <h2 class="modal-title">Listening History</h2>
          <button id="close-modal-btn" class="close-btn">&times;</button>
        </div>

        <div class="toggle-container">
          <div id="toggle-binary" class="toggle-option active">Streak</div>
          <div id="toggle-heatmap" class="toggle-option">Tracks per day</div>
        </div>

        <!-- STICKY MONTH DISPLAY BAR ABOVE WEEKDAYS -->
        <div id="sticky-month-bar" class="sticky-month-bar">Loading...</div>

        <div class="calendar-weekdays-sticky">
          <div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>
        </div>
      </div>

      <!-- CONTINUOUS SCROLLABLE CALENDAR CONTAINER -->
      <div id="modal-scroll-body" class="modal-scroll-body">
        <div id="calendar-container" class="calendar-continuous-grid">Loading history...</div>
      </div>

      <!-- STICKY BOTTOM LEGEND FOR HEATMAP MODE -->
      <div id="heatmap-legend" class="heatmap-legend">
        <span>0</span>
        <div class="legend-box" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);"></div>
        <div class="legend-box" style="background: #5f0030;"></div>
        <div class="legend-box" style="background: #99004d;"></div>
        <div class="legend-box" style="background: #d10068;"></div>
        <div class="legend-box" style="background: #ff007f;"></div>
        <span id="legend-max-label">0 tracks</span>
      </div>

    </div>
  </div>

  <script>
    let historyData = {};
    let coreData = {};
    let currentMode = 'binary';

    function formatEUDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }

    function formatDateKey(year, monthIndex, day) {
      const m = String(monthIndex + 1).padStart(2, '0');
      const d = String(day).padStart(2, '0');
      return `${year}-${m}-${d}`;
    }

    // CREATE 7-RAY SUNRAY SVG
    function createSunraySVG() {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "sunray-svg");
      svg.setAttribute("viewBox", "0 0 56 56");

      let linesHTML = '';
      const numRays = 7;
      const radiusInner = 20;
      const radiusOuter = 26;
      const cx = 28;
      const cy = 28;

      for (let i = 0; i < numRays; i++) {
        const angle = (i * 360 / numRays) * (Math.PI / 180);
        const x1 = cx + radiusInner * Math.sin(angle);
        const y1 = cy - radiusInner * Math.cos(angle);
        const x2 = cx + radiusOuter * Math.sin(angle);
        const y2 = cy - radiusOuter * Math.cos(angle);

        linesHTML += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="#ff007f" stroke-width="3" stroke-linecap="round"/>`;
      }

      svg.innerHTML = linesHTML;
      return svg;
    }

    async function loadData() {
      try {
        const [coreRes, historyRes] = await Promise.all([
          fetch('./last_played.json?cache=' + Date.now()),
          fetch('./history.json?cache=' + Date.now())
        ]);

        coreData = await coreRes.json();
        historyData = await historyRes.json();

        renderUI();
      } catch (err) {
        console.error("Data load error", err);
      }
    }

    function renderUI() {
      if (coreData.latest_track && coreData.latest_track.album_art) {
        const img = document.getElementById('cover-art');
        img.src = coreData.latest_track.album_art;
        img.style.display = 'block';

        const bgBlur = document.getElementById('bg-blur');
        bgBlur.style.backgroundImage = `url('${coreData.latest_track.album_art}')`;
        bgBlur.classList.add('loaded');
      }

      const headlineEl = document.getElementById('main-headline');
      const streak = coreData.current_streak || 0;
      if (streak > 0) {
        headlineEl.className = "main-headline active-streak";
        headlineEl.innerText = `Pietro is on a ${streak}-day ROSALÍA streak 🔥`;
      } else {
        headlineEl.className = "main-headline inactive-streak";
        headlineEl.innerText = `Pietro's ROSALÍA streak was broken 😱`;
      }

      if (coreData.longest_streak && coreData.longest_streak.count > 0) {
        document.getElementById('record-streak-val').innerText = `${coreData.longest_streak.count} Days`;
        document.getElementById('record-streak-sub').innerText = 
          `from ${formatEUDate(coreData.longest_streak.start_date)} to ${formatEUDate(coreData.longest_streak.end_date)}`;
      }

      if (coreData.peak_volume && coreData.peak_volume.count > 0) {
        document.getElementById('record-volume-val').innerText = `${coreData.peak_volume.count} Tracks`;
        document.getElementById('record-volume-sub').innerText = `on ${formatEUDate(coreData.peak_volume.date)}`;
      }

      if (coreData.latest_track) {
        const t = coreData.latest_track;
        const playedDate = new Date(t.timestamp);
        const dateFormatted = playedDate.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const timeFormatted = playedDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('track-info').innerHTML = 
          `Last track: '<a href="${t.spotify_url}" target="_blank">${t.track_name}</a>' from <a href="${t.album_url}" target="_blank">${t.album_name}</a> on ${dateFormatted} at ${timeFormatted}.`;
      }

      render7DayStrip();
    }

    function render7DayStrip() {
      const container = document.getElementById('strip-days');
      container.innerHTML = '';
      const days = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      const today = new Date();

      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(today.getDate() - i);
        const dateStr = formatDateKey(d.getFullYear(), d.getMonth(), d.getDate());
        const dayName = days[d.getDay()];

        const hasListened = historyData && (historyData[dateStr] || 0) > 0;

        const node = document.createElement('div');
        node.className = 'day-node';

        const wrapper = document.createElement('div');
        wrapper.className = 'circle-wrapper';

        const circle = document.createElement('div');
        circle.className = `cal-circle ${hasListened ? 'listened' : 'empty-dot'}`;
        circle.innerText = hasListened ? '✓' : '';

        // SHOW 7-RAY SUNRAY IF RECORD IS IN THE PAST 7 DAYS
        if (coreData.peak_volume && dateStr === coreData.peak_volume.date) {
          wrapper.appendChild(createSunraySVG());
        }

        wrapper.appendChild(circle);

        const label = document.createElement('div');
        label.className = 'cal-num';
        label.innerText = i === 0 ? 'Today' : dayName;

        node.appendChild(wrapper);
        node.appendChild(label);
        container.appendChild(node);
      }
    }

    /* RENDER TOTALLY SEAMLESS CONTINUOUS CALENDAR */
    function renderCalendar() {
      const grid = document.getElementById('calendar-container');
      const dates = Object.keys(historyData).sort(); // Ascending date order
      if (dates.length === 0) {
        grid.innerText = "No history recorded.";
        return;
      }

      grid.innerHTML = '';

      let maxCount = coreData.peak_volume ? coreData.peak_volume.count : 1;
      for (const val of Object.values(historyData)) {
        if (val > maxCount) maxCount = val;
      }
      document.getElementById('legend-max-label').innerText = `${maxCount} tracks`;

      const startDate = new Date(dates[0]);
      const endDate = new Date(dates[dates.length - 1]);

      let firstDayIndex = startDate.getDay() - 1;
      if (firstDayIndex === -1) firstDayIndex = 6;

      for (let i = 0; i < firstDayIndex; i++) grid.innerHTML += `<div></div>`;

      let curr = new Date(startDate);
      while (curr <= endDate) {
        const year = curr.getFullYear();
        const month = curr.getMonth();
        const day = curr.getDate();
        const dateStr = formatDateKey(year, month, day);
        const count = historyData[dateStr] || 0;

        const cell = document.createElement('div');
        cell.style.display = 'flex';
        cell.style.flexDirection = 'column';
        cell.style.alignItems = 'center';
        cell.dataset.dateStr = dateStr;
        cell.dataset.monthName = curr.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        const circleWrapper = document.createElement('div');
        circleWrapper.className = 'circle-wrapper';

        const circle = document.createElement('div');
        circle.className = 'cal-circle';

        const dayNum = document.createElement('div');
        dayNum.className = 'cal-num';
        dayNum.innerText = day;

        if (count > 0) {
          circle.classList.add('listened');
          circle.innerText = '✓';

          // STREAK CAPSULE GRADIENT
          if (currentMode === 'binary' && coreData.longest_streak &&
              dateStr >= coreData.longest_streak.start_date && dateStr <= coreData.longest_streak.end_date) {
            
            const dayDate = new Date(year, month, day);
            const prevD = new Date(dayDate); prevD.setDate(prevD.getDate() - 1);
            const nextD = new Date(dayDate); nextD.setDate(nextD.getDate() + 1);

            const prevDateStr = formatDateKey(prevD.getFullYear(), prevD.getMonth(), prevD.getDate());
            const nextDateStr = formatDateKey(nextD.getFullYear(), nextD.getMonth(), nextD.getDate());

            const isPrevInStreak = prevDateStr >= coreData.longest_streak.start_date && (historyData[prevDateStr] || 0) > 0 && dayDate.getDay() !== 1;
            const isNextInStreak = nextDateStr <= coreData.longest_streak.end_date && (historyData[nextDateStr] || 0) > 0 && dayDate.getDay() !== 0;

            const ribbon = document.createElement('div');
            if (!isPrevInStreak && isNextInStreak) ribbon.className = 'ribbon-pill start';
            else if (isPrevInStreak && isNextInStreak) ribbon.className = 'ribbon-pill middle';
            else if (isPrevInStreak && !isNextInStreak) ribbon.className = 'ribbon-pill end';
            else ribbon.className = 'ribbon-pill single';

            circleWrapper.appendChild(ribbon);
          }

          // HEATMAP MODE: MAGENTA SPECTRUM
          if (currentMode === 'heatmap') {
            circle.innerText = count;
            circle.classList.remove('listened');

            const ratio = count / maxCount;
            if (ratio >= 0.75) circle.style.background = '#ff007f';
            else if (ratio >= 0.50) circle.style.background = '#d10068';
            else if (ratio >= 0.25) circle.style.background = '#99004d';
            else circle.style.background = '#5f0030';

            if (coreData.peak_volume && dateStr === coreData.peak_volume.date) {
              circleWrapper.appendChild(createSunraySVG());
            }
          }
        } else {
          circle.classList.add('empty-dot');
        }

        circleWrapper.appendChild(circle);
        cell.appendChild(circleWrapper);
        cell.appendChild(dayNum);
        grid.appendChild(cell);

        curr.setDate(curr.getDate() + 1);
      }

      updateStickyMonthHeader();
    }

    // UPDATE MONTH HEADER ACCORDING TO VIEWPORT VISIBILITY
    function updateStickyMonthHeader() {
      const scrollBody = document.getElementById('modal-scroll-body');
      const cells = Array.from(scrollBody.querySelectorAll('[data-month-name]'));
      if (cells.length === 0) return;

      const bodyRect = scrollBody.getBoundingClientRect();
      const visibleMonths = new Set();

      cells.forEach(cell => {
        const rect = cell.getBoundingClientRect();
        if (rect.top < bodyRect.bottom && rect.bottom > bodyRect.top) {
          visibleMonths.add(cell.dataset.monthName);
        }
      });

      const monthsArr = Array.from(visibleMonths);
      const stickyBar = document.getElementById('sticky-month-bar');

      if (monthsArr.length === 1) {
        stickyBar.innerText = monthsArr[0];
      } else if (monthsArr.length > 1) {
        const firstParts = monthsArr[0].split(' ');
        const lastParts = monthsArr[monthsArr.length - 1].split(' ');

        if (firstParts[1] === lastParts[1]) {
          stickyBar.innerText = `${firstParts[0]} – ${lastParts[0]} ${firstParts[1]}`;
        } else {
          stickyBar.innerText = `${monthsArr[0]} – ${monthsArr[monthsArr.length - 1]}`;
        }
      }
    }

    document.getElementById('modal-scroll-body').addEventListener('scroll', updateStickyMonthHeader);

    // OPEN & CLOSE MODAL LISTENERS
    document.getElementById('open-history-btn').addEventListener('click', () => {
      document.body.classList.add('modal-open');
      document.getElementById('history-modal').classList.add('open');
      renderCalendar();
      
      const scrollBody = document.getElementById('modal-scroll-body');
      scrollBody.scrollTop = scrollBody.scrollHeight;
    });

    function closeModal() {
      document.body.classList.remove('modal-open');
      document.getElementById('history-modal').classList.remove('open');
    }

    document.getElementById('close-modal-btn').addEventListener('click', closeModal);

    document.getElementById('history-modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('history-modal')) {
        closeModal();
      }
    });

    // MODE TOGGLES
    document.getElementById('toggle-binary').addEventListener('click', () => {
      currentMode = 'binary';
      document.getElementById('toggle-binary').classList.add('active');
      document.getElementById('toggle-heatmap').classList.remove('active');
      document.getElementById('heatmap-legend').classList.remove('active');
      renderCalendar();
    });

    document.getElementById('toggle-heatmap').addEventListener('click', () => {
      currentMode = 'heatmap';
      document.getElementById('toggle-heatmap').classList.add('active');
      document.getElementById('toggle-binary').classList.remove('active');
      document.getElementById('heatmap-legend').classList.add('active');
      renderCalendar();
    });

    loadData();

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('main-card').classList.add('active');
      }, 1000);
    });
  </script>
</body>
</html>
