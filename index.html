<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pietro's ROSALÍA Tracker</title>
  <style>
    :root {
      --color-white: #ffffff;
      --color-red: #e60023;
      --spotify-green: #1db954;
      --text-sub: #d0d0d0;
      /* Easing curve for smooth animations */
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--color-white);
      position: relative;
      background-color: #0b0b0b;
      overflow-x: hidden;
      padding: 1.5rem;
    }

    /* 1. Background Blur Container Animation */
    @keyframes fadeInBg {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .bg-blur {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(20px) brightness(0.5);
      transform: scale(1.2);
      z-index: -1;
      transition: background-image 0.5s ease;
      /* Fades in from black over 0.5s */
      animation: fadeInBg 0.5s ease-out forwards;
    }

    /* 2. Card Entrance Animation */
    @keyframes fadeInUpCard {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background: rgba(18, 18, 18, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      /* Card starts after bg completes (0.5s delay) and takes 0.8s */
      opacity: 0;
      animation: fadeInUpCard 0.8s var(--ease-smooth) 0.5s forwards;
    }

    /* Small Cover Artwork */
    .cover-art {
      width: 140px;
      height: 140px;
      border-radius: 12px;
      margin: 0 auto 1.5rem;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    /* Main Header / Display Text */
    .main-display {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 1.5rem;
      letter-spacing: -0.5px;
      transition: color 0.3s ease;
    }

    .main-display.is-white {
      color: var(--color-white);
    }

    .main-display.is-red {
      color: var(--color-red);
    }

    /* Button Styling */
    .spotify-btn {
      display: inline-block;
      background-color: var(--color-white);
      color: #000000;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      padding: 0.85rem 1.75rem;
      border-radius: 50px;
      margin-bottom: 2rem;
      transition: transform 0.2s ease, background-color 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
    }

    .spotify-btn:hover {
      transform: scale(1.04);
      background-color: #f0f0f0;
    }

    /* Footer Track Info */
    .track-info {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-sub);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1.5rem;
    }

    .track-info a {
      color: var(--color-white);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }

    .track-info a:hover {
      color: var(--spotify-green);
    }

    /* 3. Staggered Content Entrance Animation */
    @keyframes fadeInUpItem {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-item {
      opacity: 0;
      /* Takes 0.8s per piece for a unhurried effect */
      animation: fadeInUpItem 0.8s var(--ease-smooth) forwards;
    }

    /* Sequenced Delays */
    .delay-1 { animation-delay: 0.80s; } /* Cover image */
    .delay-2 { animation-delay: 1.05s; } /* Main display text */
    .delay-3 { animation-delay: 1.30s; } /* Button */
    .delay-4 { animation-delay: 1.55s; } /* Footer sentence */
  </style>
</head>
<body>

  <!-- Background Blur Container -->
  <div id="bg-blur" class="bg-blur"></div>

  <div class="card">
    <!-- Small Cover Artwork -->
    <img id="cover-art" class="cover-art animate-item delay-1" src="" alt="Album Art" style="display: none;" />

    <!-- Main Counter Display -->
    <h1 id="main-display" class="main-display is-white animate-item delay-2">Loading...</h1>

    <!-- Action Button -->
    <a 
      href="https://open.spotify.com/artist/7ltDVBr6mKbRvohxheJ9h1?si=hGU9GP1URIy31v51-Cj7cQ" 
      target="_blank" 
      rel="noopener noreferrer" 
      class="spotify-btn animate-item delay-3"
    >
      Listen to ROSALÍA now
    </a>

    <!-- Recorded Song Details Footer -->
    <p id="track-info" class="track-info animate-item delay-4">
      Fetching last recorded song...
    </p>
  </div>

  <script>
    async function updateTracker() {
      try {
        const response = await fetch('./last_played.json?cache=' + Date.now());
        const data = await response.json();

        // 1. Set Album Art (Small Cover & Blurred Background)
        if (data.album_art) {
          const img = document.getElementById('cover-art');
          img.src = data.album_art;
          img.style.display = 'block';

          document.getElementById('bg-blur').style.backgroundImage = `url('${data.album_art}')`;
        }

        // 2. Compute Elapsed Time
        const lastPlayedTime = new Date(data.timestamp).getTime();
        const now = new Date().getTime();
        const diffMs = Math.max(0, now - lastPlayedTime);

        const totalHours = Math.floor(diffMs / (1000 * 60 * 60));
        const totalDays = Math.floor(totalHours / 24);

        const displayEl = document.getElementById('main-display');

        // 3. Format Dynamic Main Text, Emojis & Color Rules
        if (totalHours < 24) {
          // Less than 24 hours -> STAY WHITE with 🙂‍↕️
          displayEl.className = "main-display is-white animate-item delay-2";

          if (totalHours <= 1) {
            displayEl.innerText = "Pietro has listened to ROSALÍA within the past hour 🙂‍↕️";
          } else {
            displayEl.innerText = `Pietro has listened to ROSALÍA within the past ${totalHours} hours 🙂‍↕️`;
          }
        } else {
          // More than 24 hours -> TURN RED with 😱
          displayEl.className = "main-display is-red animate-item delay-2";

          if (totalDays < 2) {
            displayEl.innerText = "Pietro hasn't been listening to ROSALÍA for longer than a day 😱";
          } else if (totalDays <= 6) {
            displayEl.innerText = `Pietro hasn't been listening to ROSALÍA for longer than ${totalDays} days 😱`;
          } else {
            // Converts to weeks and months after 6 days
            const totalWeeks = Math.floor(totalDays / 7);
            const totalMonths = Math.floor(totalDays / 30);

            if (totalMonths >= 1) {
              const monthText = totalMonths === 1 ? "a month" : `${totalMonths} months`;
              displayEl.innerText = `Pietro hasn't been listening to ROSALÍA for longer than ${monthText} 😱`;
            } else {
              const weekText = totalWeeks === 1 ? "a week" : `${totalWeeks} weeks`;
              displayEl.innerText = `Pietro hasn't been listening to ROSALÍA for longer than ${weekText} 😱`;
            }
          }
        }

        // 4. Format Date and Time for the Footer Text
        const playedDate = new Date(data.timestamp);
        const formattedDate = playedDate.toLocaleDateString(undefined, {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });
        const formattedTime = playedDate.toLocaleTimeString(undefined, {
          hour: '2-digit',
          minute: '2-digit'
        });

        // Fallbacks for track links if not explicitly present in JSON
        const trackUrl = data.spotify_url || `https://open.spotify.com/artist/7ltDVBr6mKbRvohxheJ9h1`;
        const albumUrl = data.album_url || trackUrl; 

        // Update Footer Description with Pietro phrasing
        document.getElementById('track-info').innerHTML = 
          `The last recorded track listened by Pietro was '<a href="${trackUrl}" target="_blank" rel="noopener noreferrer">${data.track_name}</a>' ` +
          `from <a href="${albumUrl}" target="_blank" rel="noopener noreferrer">${data.album_name}</a> ` +
          `on ${formattedDate} at ${formattedTime}.`;

      } catch (err) {
        document.getElementById('main-display').innerText = "Error loading data";
        console.error("Failed to load last_played.json", err);
      }
    }

    updateTracker();
    // Refresh calculations every minute
    setInterval(updateTracker, 60000);
  </script>
</body>
</html>
